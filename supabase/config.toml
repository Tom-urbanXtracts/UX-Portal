project_id = "ux-portal"

# These endpoints authenticate inside the function because they also accept
# trusted server-to-server calls that do not carry a Supabase user JWT.
[functions.canix-inventory]
verify_jwt = false

[functions.canix-item-master]
verify_jwt = false

[functions.monday-item-master-sync]
verify_jwt = false

[functions.portal-intake]
verify_jwt = false

[functions.portal-orders]
verify_jwt = false

[functions.portal-product-content]
verify_jwt = false

[functions.portal-assets]
verify_jwt = false

[functions.quickbooks-retailers]
verify_jwt = false

# The Intuit callback has no Supabase session token. The function validates a
# one-time hashed OAuth state, while start/status remain administrator-only.
[functions.quickbooks-oauth]
verify_jwt = false

# monday.com performs the OAuth callback and webhook URL challenge without a
# Supabase session. The OAuth endpoint validates one-time PKCE state; all
# mutating board events require monday's app Signing Secret JWT.
[functions.monday-oauth]
verify_jwt = false

[functions.monday-webhook]
verify_jwt = false

[functions.portal-lot-integrity]
verify_jwt = false
