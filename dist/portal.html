n<div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px\"><span style=\"color:var(--ux-muted)\">Units<\u002Fspan><span>{{ cartUnits }}<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px\"><span style=\"color:var(--ux-muted)\">Priced subtotal<\u002Fspan><span style=\"font-weight:700\">{{ cartTotal }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:11.5px;color:var(--ux-muted);line-height:1.5;margin-bottom:16px\">{{ cartTotalNote }}<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ submitOrder }}\" style=\"{{ submitStyle }}\" style-hover=\"background:var(--ux-accent-press)\">{{ submitLabel }}<\u002Fbutton>\n<div style=\"font-size:11.5px;color:var(--ux-muted);line-height:1.5;margin-top:10px\">{{ submitNote }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOrders }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">{{ ordersTitle }}<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px\">{{ ordersSub }}<\u002Fp>\n\n<sc-if value=\"{{ hasRequests }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-bottom:30px\">\n<h2 style=\"font:800 15px/1.2 Archivo,sans-serif;margin:0 0 10px\">Price requests<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<sc-for list=\"{{ requests }}\" as=\"rq\" hint-placeholder-count=\"1\">\n<div style=\"display:grid;grid-template-columns:1.6fr 1fr .9fr auto;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:center\">\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ rq.name }}<\u002Fspan><\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ rq.loc }}<\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ rq.raised }}<\u002Fdiv>\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.05em;padding:3px 7px;{{ rq.tagStyle }}\">{{ rq.state }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size:11.5px;color:var(--ux-muted);margin-top:10px\">A request notifies the assigned representative and appears on the owner’s dashboard. The representative cannot set the price — an override needs approval and is audited.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1fr 1.2fr .9fr .6fr .8fr auto;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Order<\u002Fdiv><div>Location<\u002Fdiv><div>Placed<\u002Fdiv><div>Lines<\u002Fdiv><div>Value<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ orders }}\" as=\"o\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{ o.onOpen }}\" style=\"width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(23,14,11,.14);padding:13px 0;cursor:pointer;display:grid;grid-template-columns:1fr 1.2fr .9fr .6fr .8fr auto;gap:14px;font-size:13px;align-items:center\" style-hover=\"background:var(--ux-surface)\">\n<span style=\"font-family:ui-monospace,monospace;font-size:12px;font-weight:600\">{{ o.id }}<\u002Fspan>\n<span>{{ o.loc }}<\u002Fspan>\n<span style=\"color:var(--ux-muted)\">{{ o.placed }}<\u002Fspan>\n<span>{{ o.lines }}<\u002Fspan>\n<span><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ o.value }}<\u002Fspan><\u002Fspan>\n<span style=\"font:600 10px ui-monospace,monospace;letter-spacing:.05em;padding:3px 7px;{{ o.tagStyle }}\">{{ o.state }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ noOrders }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px solid rgba(23,14,11,.2);padding:26px;background:var(--ux-surface);font-size:14px;line-height:1.6;max-width:60ch;margin-top:16px\">No orders for this location yet.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"margin-top:22px;font-size:12px;color:var(--ux-muted);line-height:1.6;max-width:74ch\">{{ ordersNote }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOrder }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<button type=\"button\" sc-camel-on-click=\"{{ goOrdersBtn }}\" style=\"background:transparent;border:0;padding:0 0 14px;font:600 11px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-accent-text);cursor:pointer\">← ORDERS<\u002Fbutton>\n<div style=\"display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px\">\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0\">{{ odId }}<\u002Fh1>\n<span style=\"font:600 10px ui-monospace,monospace;letter-spacing:.05em;padding:4px 8px;{{ odTagStyle }}\">{{ odState }}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px\">{{ odMeta }}<\u002Fp>\n\n<div style=\"{{ odStepsStyle }}\">\n<sc-for list=\"{{ odSteps }}\" as=\"st\" hint-placeholder-count=\"4\">\n<div style=\"{{ st.style }}\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px\">{{ st.label }}<\u002Fdiv>\n<div style=\"font-size:11.5px;line-height:1.4\">{{ st.when }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{ odHasActions }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px\">\n<sc-for list=\"{{ odActions }}\" as=\"act\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ act.onDo }}\" style=\"{{ act.style }}\" style-hover=\"background:var(--ux-accent-press)\">{{ act.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:2fr .9fr .6fr .8fr .8fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Product<\u002Fdiv><div>Lot<\u002Fdiv><div>Units<\u002Fdiv><div>Unit price<\u002Fdiv><div>Line<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ odLines }}\" as=\"l\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:2fr .9fr .6fr .8fr .8fr;gap:14px;padding:13px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:center\">\n<div><div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ l.name }}<\u002Fspan><\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">{{ l.brand }} · {{ l.sku }}<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-family:ui-monospace,monospace;font-size:11.5px\">{{ l.tag }}<\u002Fdiv><div style=\"font-size:11px;color:var(--ux-muted);margin-top:2px\">{{ l.packaged }}<\u002Fdiv><\u002Fdiv>\n<div><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ l.qty }}<\u002Fspan><\u002Fdiv>\n<div>{{ l.unit }}<\u002Fdiv>\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ l.total }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display:grid;grid-template-columns:2fr .9fr .6fr .8fr .8fr;gap:14px;padding:13px 0;border-bottom:2px solid rgba(23,14,11,.4);font-size:13px\">\n<div style=\"font-weight:700\">Order value<\u002Fdiv><div><\u002Fdiv><div><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ odUnits }}<\u002Fspan><\u002Fdiv><div><\u002Fdiv><div style=\"font-weight:700\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ odValue }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ odHasNotes }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:24px\">\n<sc-for list=\"{{ odNotes }}\" as=\"n\" hint-placeholder-count=\"1\">\n<div style=\"border-left:2px solid var(--ux-signal);padding:10px 0 10px 14px;margin-bottom:12px\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:4px\">{{ n.kind }}<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.55;max-width:76ch\">{{ n.text }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:24px;font-size:12px;color:var(--ux-muted);line-height:1.6;max-width:74ch\">{{ odFooter }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isKiosk }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:520px\">\n<div style=\"border:1px solid rgba(23,14,11,.2);background:#fff;padding:22px 24px;margin-bottom:22px\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:10px\">Shared floor device · no personal login<\u002Fdiv>\n<div style=\"font-size:14px;line-height:1.6\">This tablet is authorised to a location, not a person. It shows product education only: nothing it can do requires an audit trail, and no price appears anywhere on it.<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ kioskScan }}\" style=\"width:100%;background:var(--ux-accent);color:#fff;border:0;padding:20px 22px;font:700 17px Archivo,sans-serif;text-align:left;cursor:pointer;margin-bottom:12px\" style-hover=\"background:var(--ux-accent-press)\">Scan a package tag<\u002Fbutton>\n<div style=\"display:flex;gap:10px;margin-bottom:12px\">\n<input type=\"text\" value=\"{{ kioskInput }}\" sc-camel-on-change=\"{{ onKioskInput }}\" placeholder=\"Or type the full compliance tag\" style=\"flex:1;border:1px solid rgba(23,14,11,.35);background:#fff;padding:14px;font:15px Archivo,sans-serif;border-radius:0\">\n<button type=\"button\" sc-camel-on-click=\"{{ kioskLookup }}\" style=\"background:var(--ux-ink);color:var(--ux-ground);border:0;padding:14px 18px;font:700 14px Archivo,sans-serif;cursor:pointer\" style-hover=\"background:var(--ux-muted-strong)\">Look up<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ kioskHasMsg }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:2px solid var(--ux-signal);padding:12px 0 12px 14px;margin-bottom:16px\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:4px\">{{ kioskMsgKind }}<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.55\">{{ kioskMsg }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"font-size:12px;color:var(--ux-muted);line-height:1.55;margin-bottom:26px\">The full tag is required when typing. Partial tags resolve to a list of candidates and never to a single lot — some tags in circulation share their last six digits. Try the last four digits of any tag to see that behaviour.<\u002Fdiv>\n<h2 style=\"font:800 17px/1.2 Archivo,sans-serif;margin:0 0 12px\">Recently viewed<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<sc-for list=\"{{ kioskItems }}\" as=\"k\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ k.onOpen }}\" style=\"width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(23,14,11,.14);padding:16px 0;cursor:pointer;display:flex;gap:14px;align-items:center;min-height:60px\" style-hover=\"background:var(--ux-surface)\">\n<span style=\"width:46px;height:46px;background:var(--ux-surface);border:1px solid rgba(23,14,11,.18);flex:none\"><\u002Fspan>\n<span><span style=\"display:block;font:700 15px Archivo,sans-serif\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ k.name }}<\u002Fspan><\u002Fspan><span style=\"display:block;font-size:12px;color:var(--ux-muted)\">{{ k.brand }} · {{ k.cat }}<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isEconomics }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Cost and margin<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 20px\">Internal only. Never rendered in a retailer view, and withheld while an administrator is viewing another user’s screen.<\u002Fp>\n<div style=\"border-left:2px solid var(--ux-signal);padding:12px 0 12px 16px;margin-bottom:26px;max-width:74ch\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:5px\">FIGURES BELOW ARE SYNTHETIC<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6\">Cost components exist as fields but are sparsely populated — labor cost in particular is effectively empty — so a margin computed from live data today would be wrong rather than partial. These values are placeholders for layout review; the coverage column is what makes that visible.<\u002Fdiv>\n<\u002Fdiv>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px\">\n<sc-raw-thead><sc-raw-tr style=\"border-bottom:2px solid rgba(23,14,11,.4)\">\n<sc-raw-th style=\"text-align:left;padding:9px 10px 9px 0;font:600 10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase\">Cost object<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:9px 10px;font:600 10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase\">Unit<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:9px 10px;font:600 10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase\">Revenue<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:9px 10px;font:600 10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase\">Cost<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:9px 10px;font:600 10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase\">Margin<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:left;padding:9px 0 9px 10px;font:600 10px ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase\">Cost coverage<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ econRows }}\" as=\"e\" hint-placeholder-count=\"5\">\n<sc-raw-tr style=\"border-bottom:1px solid rgba(23,14,11,.14)\">\n<sc-raw-td style=\"padding:11px 10px 11px 0;font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ e.name }}<\u002Fspan><\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:11px 10px;font-family:ui-monospace,monospace;font-size:11.5px\">{{ e.unit }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:11px 10px\">{{ e.rev }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:11px 10px\">{{ e.cost }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:11px 10px;font-weight:600\">{{ e.margin }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:11px 0 11px 10px;{{ e.covStyle }}\">{{ e.coverage }}<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"margin-top:18px;font-size:12px;color:var(--ux-muted);line-height:1.6;max-width:74ch\">Units are never blended: a figure per gram and a figure per unit are separate rows, and no combined total is offered. Rows whose coverage falls below the threshold show no margin at all rather than an understated one.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isQa }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Release and quality<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px\">A product becomes orderable only when its package status is available and its lab result has passed. Both conditions, measured together.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid rgba(23,14,11,.4);border-bottom:2px solid rgba(23,14,11,.4);margin-bottom:30px\">\n<sc-for list=\"{{ qaTiles }}\" as=\"q\" hint-placeholder-count=\"4\">\n<div style=\"{{ q.style }}\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:8px\">{{ q.label }}<\u002Fdiv>\n<div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:6px\">{{ q.value }}<\u002Fdiv>\n<div style=\"font-size:11.5px;color:var(--ux-muted);line-height:1.45\">{{ q.note }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h2 style=\"font:800 17px/1.2 Archivo,sans-serif;margin:0 0 12px\">Integrity exceptions<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<sc-for list=\"{{ integrityRows }}\" as=\"i\" hint-placeholder-count=\"7\">\n<div style=\"display:grid;grid-template-columns:1.6fr .5fr 1.3fr;gap:16px;padding:13px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ i.name }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-family:ui-monospace,monospace;font-size:12px;{{ i.countStyle }}\">{{ i.count }}<\u002Fdiv>\n<div style=\"color:var(--ux-muted);font-size:12.5px;line-height:1.5\">{{ i.effect }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:18px;font-size:12px;color:var(--ux-muted);line-height:1.6;max-width:74ch\">Counts are measured from the live subledger on 2026-08-24 and are the real figures, not samples. A retailer never sees this screen, and a failed or quarantined lot has no external presence at all — not a disabled card, not an out-of-stock label.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAccounts }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Retailer accounts<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px\">License number is the account key. A representative sees assigned accounts only, and cannot change a price on any of them.<\u002Fp>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1.5fr 1fr .7fr .7fr .8fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Account<\u002Fdiv><div>License<\u002Fdiv><div>Orders<\u002Fdiv><div>Interval<\u002Fdiv><div>Status<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ accounts }}\" as=\"a\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{ a.onOpen }}\" style=\"width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(23,14,11,.14);padding:13px 0;cursor:pointer;display:grid;grid-template-columns:1.5fr 1fr .7fr .7fr .8fr;gap:14px;font-size:13px;align-items:center\" style-hover=\"background:var(--ux-surface)\">\n<span style=\"font-weight:600\">{{ a.name }}<\u002Fspan>\n<span style=\"font-family:ui-monospace,monospace;font-size:11.5px\">{{ a.license }}<\u002Fspan>\n<span>{{ a.orders }}<\u002Fspan>\n<span style=\"color:var(--ux-muted)\">{{ a.interval }}<\u002Fspan>\n<span style=\"display:inline-block;white-space:nowrap;font:600 10px ui-monospace,monospace;letter-spacing:.05em;padding:3px 7px;{{ a.tagStyle }}\">{{ a.status }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:22px;font-size:12px;color:var(--ux-muted);line-height:1.6;max-width:74ch\">Reorder intervals are computed from each account’s own order history and nothing else. There is no sell-through feed and none is planned, so no velocity or sales-rate claim is made anywhere in the portal.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isValidation }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Validation queue<\u002Fh1>\n<p style=\"font-size:15px;line-height:1.6;max-width:66ch;margin:0 0 8px\">Everything the portal cannot yet show truthfully, grouped by the kind of answer that closes it. An item closes when the named answer exists — not when someone builds a screen around it.<\u002Fp>\n<p style=\"font-size:13px;color:var(--ux-muted);margin:0 0 28px\">{{ validationSummary }}<\u002Fp>\n\n<sc-for list=\"{{ validationGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n<div style=\"margin-bottom:36px\">\n<div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid rgba(23,14,11,.4);padding-bottom:10px;margin-bottom:4px\">\n<span style=\"font:600 10px ui-monospace,monospace;letter-spacing:.06em;background:var(--ux-ink);color:var(--ux-ground);padding:4px 7px\">{{ g.cls }}<\u002Fspan>\n<span style=\"font:600 13px Archivo,sans-serif\">{{ g.closedBy }}<\u002Fspan>\n<span style=\"flex:1\"><\u002Fspan>\n<span style=\"font:600 11px ui-monospace,monospace;color:var(--ux-muted)\">{{ g.countLabel }}<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ g.items }}\" as=\"v\" hint-placeholder-count=\"3\">\n<div style=\"padding:15px 0;border-bottom:1px solid rgba(23,14,11,.14)\">\n<div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px\">\n<span style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.05em;padding:3px 7px;{{ v.sevStyle }}\">{{ v.severity }}<\u002Fspan>\n<span style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.05em;padding:3px 7px;background:var(--ux-surface);color:var(--ux-muted-strong)\">{{ v.screen }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font:700 14.5px/1.4 Archivo,sans-serif;margin-bottom:6px\">{{ v.question }}<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.6;color:var(--ux-muted-strong);max-width:78ch\">{{ v.detail }}<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:10px;font-size:11.5px;color:var(--ux-muted)\">\n<div><span style=\"font:600 9px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-faint)\">Blocks<\u002Fspan><br>{{ v.blocks }}<\u002Fdiv>\n<div><span style=\"font:600 9px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-faint)\">Proposed owner<\u002Fspan><br>{{ v.owner }}<\u002Fdiv>\n<div><span style=\"font:600 9px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-faint)\">Evidence needed<\u002Fspan><br>{{ v.evidence }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n\n<div style=\"margin-top:12px;background:var(--ux-ink);color:var(--ux-ground);padding:24px 26px\">\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ux-accent-light);margin-bottom:12px\">Verified and in use<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.7;max-width:78ch\">Release state, lab result, compliance tag, packaged date, category, brand, SKU, unit type and quantity, order state, account license and order history were all read from live connectors on 2026-08-24 and are used as-is. Every other value in this prototype is either synthetic and labelled, or shown as a pending state above.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">{{ adminTitle }}<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 16px;max-width:70ch\">{{ adminSub }}<\u002Fp>\n<div style=\"margin:0 0 24px\"><button type=\"button\" sc-camel-on-click=\"{{ onInvite }}\" style=\"background:var(--ux-accent);color:#fff;border:0;padding:10px 14px;font:700 12.5px Archivo,sans-serif;cursor:pointer\">Invite a user<\u002Fbutton><\u002Fdiv>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1.4fr 1.1fr 1.15fr .85fr auto;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>User<\u002Fdiv><div>Organisation<\u002Fdiv><div>Role<\u002Fdiv><div>Scope<\u002Fdiv><div>Actions<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ users }}\" as=\"u\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:1.4fr 1.1fr 1.15fr .85fr auto;gap:14px;padding:13px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:center\">\n<div><div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ u.name }}<\u002Fspan><\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">{{ u.email }}<\u002Fdiv><\u002Fdiv>\n<div>{{ u.org }}<\u002Fdiv>\n<div><span style=\"{{ u.roleStyle }}\">{{ u.role }}<\u002Fspan><\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ u.locs }}<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<sc-if value=\"{{ u.canImpersonate }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ u.onImpersonate }}\" style=\"background:transparent;border:1px solid rgba(23,14,11,.3);padding:7px 10px;font:600 11.5px Archivo,sans-serif;cursor:pointer\" style-hover=\"background:var(--ux-surface)\">View as<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ u.canChangeRole }}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ u.onRoleChange }}\" style=\"background:transparent;border:1px solid rgba(23,14,11,.3);padding:7px 10px;font:600 11.5px Archivo,sans-serif;cursor:pointer\" style-hover=\"background:var(--ux-surface)\">Change role<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ u.canDeactivate }}\" hint-placeholder-val=\"{{ true }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ u.onDeactivate }}\" style=\"background:transparent;border:1px solid rgba(23,14,11,.3);padding:7px 10px;font:600 11.5px Archivo,sans-serif;cursor:pointer;color:var(--ux-signal-text);border-color:rgba(163,49,22,.45)\" style-hover=\"background:var(--ux-surface)\">Deactivate<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:12px;color:var(--ux-muted);line-height:1.6;max-width:74ch\">Both actions write an audit entry that the affected organisation can read. A kiosk device has no personal login, so it cannot be viewed as — there is no user behind it to attribute anything to.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAuditLog }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Audit history<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px;max-width:70ch\">Eight actions generate an entry. Visible means the organisation affected can read it — a log only an administrator can see is not an audit trail from the retailer’s side.<\u002Fp>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:.9fr 1fr 1.3fr 1.5fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>When<\u002Fdiv><div>Actor<\u002Fdiv><div>Action<\u002Fdiv><div>Subject and detail<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ auditRows }}\" as=\"a\" hint-placeholder-count=\"5\">\n<div style=\"display:grid;grid-template-columns:.9fr 1fr 1.3fr 1.5fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:12.5px;align-items:baseline\">\n<div style=\"font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ux-muted)\">{{ a.ts }}<\u002Fdiv>\n<div>{{ a.actor }}<\u002Fdiv>\n<div style=\"font-weight:600\">{{ a.action }}<\u002Fdiv>\n<div><div>{{ a.subject }}<\u002Fdiv><div style=\"color:var(--ux-muted);font-size:11.5px;margin-top:2px\">{{ a.detail }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:20px;font-size:12px;color:var(--ux-muted);line-height:1.6;max-width:74ch\">Approve, decline, view-as and role changes in this prototype write real entries — drive the portal and watch this list grow. Retention is not set; it belongs with the records decision, not the interface.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isNotifications }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Notifications<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 20px;max-width:70ch\">{{ notifSub }}<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{ markNotifRead }}\" style=\"background:transparent;border:1px solid rgba(23,14,11,.3);padding:9px 13px;font:700 12px Archivo,sans-serif;cursor:pointer;margin-bottom:22px\" style-hover=\"background:var(--ux-surface)\">Mark all as read<\u002Fbutton>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<sc-for list=\"{{ notifications }}\" as=\"n\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{ n.onOpen }}\" style=\"width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(23,14,11,.14);padding:16px 0;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:baseline\" style-hover=\"background:var(--ux-surface)\">\n<span style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.06em;padding:3px 7px;background:var(--ux-surface);color:var(--ux-muted-strong)\">{{ n.kind }}<\u002Fspan>\n<span><span style=\"display:block;font:700 14.5px Archivo,sans-serif;margin-bottom:4px\">{{ n.title }}<\u002Fspan><span style=\"display:block;font-size:13px;color:var(--ux-muted-strong);line-height:1.55\">{{ n.body }}<\u002Fspan><\u002Fspan>\n<span style=\"font-size:11.5px;color:var(--ux-muted)\">{{ n.when }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCompare }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Compare products<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px;max-width:70ch\">Two released products side by side. Rows whose source does not exist yet say so rather than showing a plausible value — which is most of what a comparison is for.<\u002Fp>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:16px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.2)\">\n<div><\u002Fdiv>\n<div style=\"font:700 14px Archivo,sans-serif\">{{ compareA }}<\u002Fdiv>\n<div style=\"font:700 14px Archivo,sans-serif\">{{ compareB }}<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ compareRows }}\" as=\"r\" hint-placeholder-count=\"9\">\n<div style=\"display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:16px;padding:11px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">{{ r.label }}<\u002Fdiv>\n<div>{{ r.a }}<\u002Fdiv>\n<div>{{ r.b }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isReceivables }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Receivables<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 18px;max-width:76ch\">Balance, terms, invoices and what the ordering gate is reading &mdash; for your organisation, by location. This screen exists for the owner only. A buyer learns that the gate fired and who to contact, and never sees a balance by any route.<\u002Fp>\n<div style=\"border-left:3px solid var(--ux-signal);padding:12px 0 12px 16px;margin:0 0 24px;max-width:78ch\">\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:6px\">EVERY FIGURE HERE IS PENDING<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.62\">The ledger connector is not attached, so no balance on this screen is read from the ledger &mdash; the figures are placeholders and are highlighted as such. The structure is real; the numbers are not, and the portal will show a pending state rather than an estimate until the connection exists.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;border-top:2px solid rgba(23,14,11,.4);border-bottom:2px solid rgba(23,14,11,.4);margin-bottom:28px\">\n<div style=\"padding:14px 18px 14px 0;border-right:1px solid rgba(23,14,11,.14);flex:1;min-width:150px\"><div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">Outstanding<\u002Fdiv><div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:5px\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ arOutstanding }}<\u002Fspan><\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">Across {{ arOpenCount }} unpaid invoices.<\u002Fdiv><\u002Fdiv><div style=\"padding:14px 18px 14px 0;border-right:1px solid rgba(23,14,11,.14);flex:1;min-width:150px\"><div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">Past due<\u002Fdiv><div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:5px\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ arOverdue }}<\u002Fspan><\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">What the gate is firing on today.<\u002Fdiv><\u002Fdiv><div style=\"padding:14px 18px 14px 0;flex:1;min-width:150px\"><div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">Locations blocked<\u002Fdiv><div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:5px\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ arBlockedCount }}<\u002Fspan><\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">Blocked at order entry, not at shipping.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:0 0 12px\">By location<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1fr .7fr .7fr .8fr .6fr 1fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Location<\u002Fdiv><div>Outstanding<\u002Fdiv><div>Past due<\u002Fdiv><div>Oldest<\u002Fdiv><div>Terms<\u002Fdiv><div>Receivables gate<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ arRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:1fr .7fr .7fr .8fr .6fr 1fr;gap:14px;padding:13px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div><div style=\"font-weight:600\">{{ r.name }}<\u002Fdiv><div style=\"font:500 12px ui-monospace,Menlo,monospace;font-size:11px;color:var(--ux-muted)\">{{ r.license }}<\u002Fdiv><\u002Fdiv>\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ r.outstanding }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ r.overdue }}<\u002Fspan><\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ r.oldest }}<\u002Fdiv>\n<div>{{ r.terms }}<\u002Fdiv>\n<div><span style=\"{{ r.gateStyle }}\">{{ r.gate }}<\u002Fspan><div style=\"font-size:11px;color:var(--ux-muted);margin-top:5px\">{{ r.otherGate }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Invoices<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:.8fr .9fr .8fr .8fr .5fr .7fr .8fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Invoice<\u002Fdiv><div>Location<\u002Fdiv><div>Issued<\u002Fdiv><div>Due<\u002Fdiv><div>Age<\u002Fdiv><div>Amount<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ arInvoices }}\" as=\"i\" hint-placeholder-count=\"7\">\n<div style=\"display:grid;grid-template-columns:.8fr .9fr .8fr .8fr .5fr .7fr .8fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font:500 12px ui-monospace,Menlo,monospace;font-weight:600\">{{ i.id }}<\u002Fdiv>\n<div>{{ i.loc }}<\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ i.issued }}<\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ i.due }}<\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ i.ageText }}<\u002Fdiv>\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ i.amount }}<\u002Fspan><\u002Fdiv>\n<div><span style=\"{{ i.stateStyle }}\">{{ i.state }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">What the gate is reading<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\"><div style=\"font-weight:700\">When it fires<\u002Fdiv><div>At order entry, never at shipping. A blocked draft is kept exactly as it is &mdash; nothing is discarded and nothing is silently reduced.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\"><div style=\"font-weight:700\">What a buyer sees<\u002Fdiv><div>That the gate fired, and who to contact. Not the balance, not the invoice, not the age. That distinction is the whole reason this screen is owner-only.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\"><div style=\"font-weight:700\">Scope<\u002Fdiv><div>The location, not the organisation. Riverside being blocked does not stop Downtown ordering &mdash; and this column reports the receivables gate alone. A location can be clear here and still be unable to order, because another gate is holding it.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\"><div style=\"font-weight:700\">The threshold<\u002Fdiv><div><strong>Undefined.<\u002Fstrong> Whether past due means a number of days, an amount, or both has not been decided, so today the flag is set by hand rather than computed. It is carried as a blocking item in the validation queue, owned by finance.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:190px 1fr;gap:20px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\"><div style=\"font-weight:700\">The source<\u002Fdiv><div>The ledger, once connected. Until then every figure here is a placeholder and the portal says so rather than estimating one.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:26px;border-left:3px solid var(--ux-signal);padding:12px 0 12px 16px;max-width:78ch\">\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:6px\">HOW TO PAY IS NOT ON THIS SCREEN<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.62\">Banking, remittance and signatory details live in the onboarding record and are not rendered anywhere in the portal, here included. Settling an invoice goes through the contact on your account, and this screen tells you what is owed rather than how to send money.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRecords }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Your records<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 8px;max-width:74ch\">Everything urbanXtracts holds about your organisation, in one place, without asking a rep. Orders and their lines, the lots you received with the COA version current at receipt, licenses, claims, documents, notices we have sent you, and your own audit history.<\u002Fp>\n<p style=\"font-size:12.5px;color:var(--ux-muted);margin:0 0 4px\"><strong>Scope:<\u002Fstrong> {{ recScope }}<\u002Fp>\n<p style=\"font-size:12.5px;color:var(--ux-muted);margin:0 0 18px\">{{ recCounts }}<\u002Fp>\n<div style=\"margin:0 0 26px\"><button type=\"button\" sc-camel-on-click=\"{{ onRecExport }}\" style=\"background:var(--ux-accent);color:#fff;border:0;padding:11px 15px;font:700 12.5px Archivo,sans-serif;cursor:pointer\">Export everything here<\u002Fbutton><\u002Fdiv>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:0 0 12px\">Orders<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:.7fr .8fr .8fr .4fr .7fr .8fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Order<\u002Fdiv><div>Location<\u002Fdiv><div>Placed<\u002Fdiv><div>Lines<\u002Fdiv><div>Value<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recOrders }}\" as=\"o\" hint-placeholder-count=\"5\">\n<div style=\"display:grid;grid-template-columns:.7fr .8fr .8fr .4fr .7fr .8fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font:500 12px ui-monospace,Menlo,monospace;font-weight:600\">{{ o.id }}<\u002Fdiv><div>{{ o.loc }}<\u002Fdiv><div style=\"color:var(--ux-muted)\">{{ o.placed }}<\u002Fdiv><div>{{ o.lines }}<\u002Fdiv><div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ o.value }}<\u002Fspan><\u002Fdiv><div><span style=\"{{ o.stateStyle }}\">{{ o.state }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Lots received<\u002Fh2>\n<p style=\"font-size:13px;color:var(--ux-muted);margin:0 0 12px;max-width:74ch\">The COA version as it stood when the lot reached you, not as it stands now. If a COA is later amended you are notified and both versions stay resolvable.<\u002Fp>\n<sc-if value=\"{{ recNoLots }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-top:2px solid rgba(23,14,11,.4);border-bottom:2px solid rgba(23,14,11,.4);padding:14px 0;font-size:13px;color:var(--ux-muted)\">No lot in scope has been received yet. A lot appears here once its order reaches Received, with the COA version as it stood that day.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1.2fr 1.1fr .4fr .6fr .9fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Product<\u002Fdiv><div>Compliance tag<\u002Fdiv><div>Units<\u002Fdiv><div>Order<\u002Fdiv><div>COA at receipt<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recLots }}\" as=\"l\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:1.2fr 1.1fr .4fr .6fr .9fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ l.name }}<\u002Fspan><\u002Fdiv><div style=\"font:500 12px ui-monospace,Menlo,monospace;color:var(--ux-muted)\">{{ l.tag }}<\u002Fdiv><div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ l.qty }}<\u002Fspan><\u002Fdiv><div style=\"font:500 12px ui-monospace,Menlo,monospace\">{{ l.order }}<\u002Fdiv><div style=\"color:var(--ux-muted)\">{{ l.coa }} · received {{ l.when }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Licenses<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Location<\u002Fdiv><div>License number<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recLicenses }}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font-weight:600\">{{ c.name }}<\u002Fdiv><div style=\"font:500 12px ui-monospace,Menlo,monospace\">{{ c.license }}<\u002Fdiv><div><span style=\"{{ c.stateStyle }}\">{{ c.state }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Claims<\u002Fh2>\n<sc-if value=\"{{ recNoClaims }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-top:2px solid rgba(23,14,11,.4);border-bottom:2px solid rgba(23,14,11,.4);padding:14px 0;font-size:13px;color:var(--ux-muted)\">No claim has been raised on an order in scope. A short, damaged or refused line is raised from the order itself once it is received.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ recHasClaims }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:.7fr 1.2fr 1.4fr .7fr .9fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Order<\u002Fdiv><div>Line<\u002Fdiv><div>Reason<\u002Fdiv><div>Raised<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recClaims }}\" as=\"k\" hint-placeholder-count=\"2\">\n<div style=\"display:grid;grid-template-columns:.7fr 1.2fr 1.4fr .7fr .9fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font:500 12px ui-monospace,Menlo,monospace\">{{ k.order }}<\u002Fdiv><div><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ k.line }}<\u002Fspan><\u002Fdiv><div style=\"color:var(--ux-muted)\">{{ k.reason }}<div style=\"font-size:11px\">{{ k.locName }}<\u002Fdiv><\u002Fdiv><div style=\"color:var(--ux-muted)\">{{ k.raised }}<\u002Fdiv><div><span style=\"{{ k.stateStyle }}\">{{ k.state }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Notices<\u002Fh2>\n<sc-if value=\"{{ recHasNotices }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:.9fr 1.3fr .7fr 1.2fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Kind<\u002Fdiv><div>Subject<\u002Fdiv><div>Sent<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recNotices }}\" as=\"n\" hint-placeholder-count=\"1\">\n<div style=\"display:grid;grid-template-columns:.9fr 1.3fr .7fr 1.2fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font-weight:600\">{{ n.kind }}<\u002Fdiv><div style=\"font:500 12px ui-monospace,Menlo,monospace\">{{ n.subject }}<\u002Fdiv><div style=\"color:var(--ux-muted)\">{{ n.when }}<\u002Fdiv><div><span style=\"{{ n.stateStyle }}\">{{ n.state }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ recNoNotices }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border-top:2px solid rgba(23,14,11,.4);border-bottom:2px solid rgba(23,14,11,.4);padding:14px 0;font-size:13px;color:var(--ux-muted)\">No notice has been sent to your organisation. Recall and amended-COA notices appear here, and they are the two a user cannot switch off.<\u002Fdiv>\n<\u002Fsc-if>\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Audit history<\u002Fh2>\n<p style=\"font-size:13px;color:var(--ux-muted);margin:0 0 12px;max-width:74ch\">Your organisation&rsquo;s own actions, and ours where they touched you. An administrator viewing your screen appears here — a log only we could read would not be an audit trail from your side of it.<\u002Fp>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:.9fr .9fr 1fr 1.6fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>When<\u002Fdiv><div>Actor<\u002Fdiv><div>Action<\u002Fdiv><div>Detail<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recAudit }}\" as=\"a\" hint-placeholder-count=\"5\">\n<div style=\"display:grid;grid-template-columns:.9fr .9fr 1fr 1.6fr;gap:14px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font:500 12px ui-monospace,Menlo,monospace;color:var(--ux-muted)\">{{ a.ts }}<\u002Fdiv><div>{{ a.actor }}<\u002Fdiv><div style=\"font-weight:600\">{{ a.action }}<\u002Fdiv><div style=\"color:var(--ux-muted)\">{{ a.subject }} · {{ a.detail }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:26px;border-left:3px solid var(--ux-signal);padding:12px 0 12px 16px;max-width:78ch\">\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:6px\">WHAT IS NOT HERE, AND IS NOT IN THE EXPORT<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.62\">Cost, margin, discount depth, ownership code and rate cards do not appear on this screen and are not in the file it produces — the export is the same authorization rendered a second way, never a second authorization. Neither is any part of another organisation, by search, filter, export or error message.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRecall }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Recall and lot impact<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 20px;max-width:74ch\">Lineage runs forward from an inbound lot to one allocation. This runs the other way and answers the only question a recall asks: <em>who has this<\u002Fem>. Internal only &mdash; and it is not the escalation path. A product-safety issue goes to the CCO immediately and is itself a recall trigger; this is what the escalation uses once the CCO has decided.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px\">\n<input type=\"text\" value=\"{{ recallInput }}\" sc-camel-on-input=\"{{ onRecallInput }}\" placeholder=\"Full compliance tag\" style=\"flex:1;min-width:280px;padding:11px 13px;border:1px solid rgba(23,14,11,.3);background:#fff;font:500 13px ui-monospace,Menlo,monospace\">\n<button type=\"button\" sc-camel-on-click=\"{{ recallLookup }}\" style=\"background:var(--ux-accent);color:#fff;border:0;padding:11px 15px;font:700 12.5px Archivo,sans-serif;cursor:pointer\">Resolve lot<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ recallHasMsg }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid var(--ux-signal);padding:10px 0 10px 14px;margin-bottom:18px;max-width:74ch\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:4px\">{{ recallMsgKind }}<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.55\">{{ recallMsg }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"border-top:2px solid rgba(23,14,11,.4);border-bottom:1px solid rgba(23,14,11,.14);padding:14px 0;margin:14px 0 0\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">Lot under review<\u002Fdiv>\n<div style=\"font:700 16px Archivo,sans-serif;margin-bottom:4px\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ recallLotName }}<\u002Fspan><\u002Fdiv>\n<div style=\"font:500 12px ui-monospace,Menlo,monospace;color:var(--ux-muted)\">{{ recallTagText }}<\u002Fdiv>\n<div style=\"font-size:12px;color:var(--ux-muted);margin-top:3px\">{{ recallLotMeta }}<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;border-bottom:2px solid rgba(23,14,11,.4);margin-bottom:26px\">\n<div style=\"padding:14px 18px 14px 0;border-right:1px solid rgba(23,14,11,.14);flex:1;min-width:150px\"><div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">Delivered<\u002Fdiv><div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:5px\">{{ recallDeliveredQty }}<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">Out of our hands. Notice is the only lever.<\u002Fdiv><\u002Fdiv><div style=\"padding:14px 18px 14px 0;border-right:1px solid rgba(23,14,11,.14);flex:1;min-width:150px\"><div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">Not yet delivered<\u002Fdiv><div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:5px\">{{ recallInflightQty }}<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">Allocated or in transit &mdash; stoppable at our end.<\u002Fdiv><\u002Fdiv><div style=\"padding:14px 18px 14px 0;border-right:1px solid rgba(23,14,11,.14);flex:1;min-width:150px\"><div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">In our custody<\u002Fdiv><div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:5px\">{{ recallCustodyQty }}<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">Quarantine on the spot; nobody needs telling.<\u002Fdiv><\u002Fdiv><div style=\"padding:14px 18px 14px 0;flex:1;min-width:150px\"><div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:6px\">In open drafts<\u002Fdiv><div style=\"font:800 26px/1 Archivo,sans-serif;letter-spacing:-.02em;margin-bottom:5px\">{{ recallDraftQty }}<\u002Fdiv><div style=\"font-size:11.5px;color:var(--ux-muted)\">Blocked at submit, never silently dropped.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:0 0 12px\">Where it went<\u002Fh2>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1.3fr 1fr .8fr .6fr .9fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Account<\u002Fdiv><div>Location<\u002Fdiv><div>Order<\u002Fdiv><div>Units<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recallRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n<div style=\"display:grid;grid-template-columns:1.3fr 1fr .8fr .6fr .9fr;gap:14px;padding:13px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:center\">\n<div><div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ r.org }}<\u002Fspan><\u002Fdiv><div style=\"font-size:11px;color:var(--ux-muted)\">{{ r.license }}<\u002Fdiv><\u002Fdiv>\n<div>{{ r.loc }}<\u002Fdiv>\n<div style=\"font:500 12px ui-monospace,Menlo,monospace\">{{ r.order }}<\u002Fdiv>\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ r.qty }}<\u002Fspan><\u002Fdiv>\n<div><span style=\"{{ r.stateStyle }}\">{{ r.state }}<\u002Fspan><div style=\"font-size:11px;color:var(--ux-muted);margin-top:4px\">{{ r.when }} · signed {{ r.signed }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Still stoppable<\u002Fh2>\n<p style=\"font-size:13px;color:var(--ux-muted);margin:0 0 12px;max-width:74ch\">A recall that only chases delivered stock misses the three places it is easiest to stop.<\u002Fp>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<sc-for list=\"{{ recallStoppable }}\" as=\"c\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:1.2fr .4fr 1.6fr;gap:16px;padding:12px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font-weight:600\">{{ c.where }}<\u002Fdiv>\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ c.qty }}<\u002Fspan><\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ c.note }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<h2 style=\"font:800 19px/1.2 Archivo,sans-serif;margin:34px 0 12px\">Notice and acknowledgement<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px\">\n<span style=\"{{ recallNoticeStyle }}\">{{ recallNoticeText }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ onRecallIssue }}\" style=\"background:var(--ux-accent);color:#fff;border:0;padding:11px 15px;font:700 12.5px Archivo,sans-serif;cursor:pointer\">Issue the notice<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1.3fr 1fr .5fr 1fr auto;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Account<\u002Fdiv><div>Locations<\u002Fdiv><div>Units<\u002Fdiv><div>Acknowledgement<\u002Fdiv><div><\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ recallAccounts }}\" as=\"a\" hint-placeholder-count=\"4\">\n<div style=\"display:grid;grid-template-columns:1.3fr 1fr .5fr 1fr auto;gap:14px;padding:13px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:center\">\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ a.org }}<\u002Fspan><\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ a.locs }}<\u002Fdiv>\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ a.qty }}<\u002Fspan><\u002Fdiv>\n<div><span style=\"{{ a.ackStyle }}\">{{ a.ackText }}<\u002Fspan><\u002Fdiv>\n<div><sc-if value=\"{{ a.canAck }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" sc-camel-on-click=\"{{ a.onAck }}\" style=\"background:transparent;border:1px solid rgba(23,14,11,.3);padding:7px 10px;font:600 11.5px Archivo,sans-serif;cursor:pointer\" style-hover=\"background:var(--ux-surface)\">Record acknowledgement<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"margin-top:24px;border-left:3px solid var(--ux-signal);padding:12px 0 12px 16px;max-width:78ch\">\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:6px\">THE WORDING IS NOT OURS TO WRITE<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.62\">The portal carries whatever wording the CCO has approved and never composes it. Acknowledgement is recorded against the account, never against a named person &mdash; the store decides who answers for it. A store sees the notice on the affected order and on the lot, and nothing else: no internal owner, no clock, no lineage, and never another account&rsquo;s row.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDocuments }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Documents<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 16px;max-width:72ch\">The paper between us, in one place &mdash; what you send and what we issue. The license gate has told a blocked shop to upload its renewal since the first draft of this design, and until now there was nowhere to upload it.<\u002Fp>\n<div style=\"margin:0 0 24px\"><button type=\"button\" sc-camel-on-click=\"{{ onUpload }}\" style=\"background:var(--ux-accent);color:#fff;border:0;padding:10px 14px;font:700 12.5px Archivo,sans-serif;cursor:pointer\">Upload a document<\u002Fbutton><\u002Fdiv>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1.6fr 1fr 1.2fr .8fr;gap:14px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Document<\u002Fdiv><div>Type<\u002Fdiv><div>Dates<\u002Fdiv><div>State<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ docs }}\" as=\"d\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:1.6fr 1fr 1.2fr .8fr;gap:14px;padding:13px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:center\">\n<div><button type=\"button\" sc-camel-on-click=\"{{ d.onOpen }}\" style=\"background:transparent;border:0;padding:0;text-align:left;cursor:pointer;font:600 13px Archivo,sans-serif\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ d.name }}<\u002Fspan><\u002Fbutton><div style=\"font-size:11.5px;color:var(--ux-muted)\">{{ d.loc }}<\u002Fdiv><\u002Fdiv>\n<div>{{ d.type }}<\u002Fdiv>\n<div style=\"color:var(--ux-muted)\">{{ d.dates }}<\u002Fdiv>\n<div><span style=\"{{ d.stateStyle }}\">{{ d.state }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:22px;border-left:3px solid var(--ux-signal);padding:12px 0 12px 16px;max-width:76ch\">\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:6px\">AN UPLOAD NEVER LIFTS A GATE<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.62\">Sending a license renewal does not clear your license gate. The gate reads the license record, and an urbanXtracts reviewer updates that record after looking at the document &mdash; otherwise a file attachment would clear a compliance block. Banking, remittance and signatory details are refused here and stay in the onboarding record.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOnboarding }}\" hint-placeholder-val=\"{{ false }}\">\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Store onboarding<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px;max-width:72ch\">Six stages from intake to ready-to-order. Internal only &mdash; a store does not onboard itself, because two stages are ours to decide and one is a compliance qualification. Every account short of stage six shows exactly which stage it is sitting in.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;border-top:2px solid rgba(23,14,11,.4);border-bottom:2px solid rgba(23,14,11,.4);margin-bottom:26px\">\n<div style=\"flex:1;min-width:120px;padding:12px 14px 12px 0;font-size:12px\"><div style=\"font:600 10px ui-monospace,monospace;color:var(--ux-muted)\">01<\u002Fdiv>Intake<\u002Fdiv><div style=\"flex:1;min-width:120px;padding:12px 14px;border-left:1px solid rgba(23,14,11,.14);font-size:12px\"><div style=\"font:600 10px ui-monospace,monospace;color:var(--ux-muted)\">02<\u002Fdiv>Qualification<\u002Fdiv><div style=\"flex:1;min-width:120px;padding:12px 14px;border-left:1px solid rgba(23,14,11,.14);font-size:12px\"><div style=\"font:600 10px ui-monospace,monospace;color:var(--ux-muted)\">03<\u002Fdiv>Commercial terms<\u002Fdiv><div style=\"flex:1;min-width:120px;padding:12px 14px;border-left:1px solid rgba(23,14,11,.14);font-size:12px\"><div style=\"font:600 10px ui-monospace,monospace;color:var(--ux-muted)\">04<\u002Fdiv>Account creation<\u002Fdiv><div style=\"flex:1;min-width:120px;padding:12px 14px;border-left:1px solid rgba(23,14,11,.14);font-size:12px\"><div style=\"font:600 10px ui-monospace,monospace;color:var(--ux-muted)\">05<\u002Fdiv>Access<\u002Fdiv><div style=\"flex:1;min-width:120px;padding:12px 0 12px 14px;border-left:1px solid rgba(23,14,11,.14);font-size:12px\"><div style=\"font:600 10px ui-monospace,monospace;color:var(--ux-muted)\">06<\u002Fdiv>Ready to order<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:2px solid rgba(23,14,11,.4)\">\n<div style=\"display:grid;grid-template-columns:1.3fr 1.3fr 1.6fr;gap:16px;padding:9px 0;border-bottom:1px solid rgba(23,14,11,.2);font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted)\">\n<div>Organisation<\u002Fdiv><div>Licenses<\u002Fdiv><div>Stage and what is holding it<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{ onboarding }}\" as=\"o\" hint-placeholder-count=\"4\">\n<div style=\"display:grid;grid-template-columns:1.3fr 1.3fr 1.6fr;gap:16px;padding:14px 0;border-bottom:1px solid rgba(23,14,11,.14);font-size:13px;align-items:baseline\">\n<div style=\"font-weight:600\"><span style=\"background:#fdf0a8;box-shadow:0 0 0 2px #fdf0a8\">{{ o.org }}<\u002Fspan><\u002Fdiv>\n<div style=\"color:var(--ux-muted);font-size:12px\">{{ o.licenses }}<\u002Fdiv>\n<div><span style=\"{{ o.stageStyle }}\">{{ o.stageLabel }}<\u002Fspan><div style=\"margin-top:6px;line-height:1.55\">{{ o.note }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:22px;border-left:3px solid var(--ux-signal);padding:12px 0 12px 16px;max-width:76ch\">\n<div style=\"font:600 10px ui-monospace,monospace;letter-spacing:.06em;color:var(--ux-signal-text);margin-bottom:6px\">WHAT THE ONBOARDING RECORD HOLDS, AND KEEPS<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.62\">License numbers, banking, remittance and signatory details are captured here and stay here. They are not surfaced on the account screen, in the store records surface, through the store API, or in any export. The account key the rest of the system uses is the license number; everything else in this sentence has no second home by design. At qualification we record what the state record says and never assert on our own authority that a license is valid.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTraining }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Training<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px;max-width:70ch\">Process education, not product claims. Nothing here describes how a product feels or what it does — that language does not belong in a portal staff read from.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px\">\n<sc-for list=\"{{ trainingCards }}\" as=\"t\" hint-placeholder-count=\"4\">\n<div style=\"border:1px solid rgba(23,14,11,.2);background:#fff;padding:20px 22px\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--ux-muted);margin-bottom:9px\">{{ t.kind }}<\u002Fdiv>\n<div style=\"font:700 16px/1.3 Archivo,sans-serif;margin-bottom:8px\">{{ t.title }}<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:var(--ux-muted-strong)\">{{ t.body }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCoaLookup }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Public COA page<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 8px;max-width:70ch\">Unauthenticated, reached by the printed code. The code is the only key — a QR simply prefills it rather than resolving by its own path.<\u002Fp>\n<p style=\"font-size:13px;color:var(--ux-signal-text);margin:0 0 26px;max-width:70ch\">Nothing publishes while the display, retention and recall decisions are open. The mechanism below is designed for either answer.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px\">\n<sc-for list=\"{{ coaStates }}\" as=\"c\" hint-placeholder-count=\"6\">\n<div style=\"border:1px solid rgba(23,14,11,.2);background:#fff;padding:20px 22px\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.07em;padding:3px 7px;background:var(--ux-surface);color:var(--ux-muted-strong);display:inline-block;margin-bottom:11px\">{{ c.kind }}<\u002Fdiv>\n<div style=\"font:700 15.5px/1.3 Archivo,sans-serif;margin-bottom:8px\">{{ c.title }}<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.6;color:var(--ux-muted-strong)\">{{ c.body }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAccess }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h1 style=\"font:800 30px/1.1 Archivo,sans-serif;letter-spacing:-.02em;margin:0 0 6px\">Access and session states<\u002Fh1>\n<p style=\"font-size:14px;color:var(--ux-muted);margin:0 0 24px;max-width:70ch\">Every state a user can land in outside the normal flow. None of them reveals whether the thing behind the wall exists, and none relies on the interface for enforcement.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;border:1px solid rgba(23,14,11,.2);margin-bottom:26px\">\n<div style=\"flex:1;min-width:260px;background:var(--ux-ink);color:var(--ux-ground);padding:34px 32px;display:flex;flex-direction:column;gap:16px\">\n<img src=\"d2f8b858-a5a0-4ceb-b2a5-c13f102e4f90\" alt=\"\" style=\"height:46px;width:auto;display:block;align-self:flex-start;object-fit:contain\">\n<div style=\"font:800 26px/1.1 Archivo,sans-serif;letter-spacing:-.02em\">urbanXtracts<br>Wholesale portal<\u002Fdiv>\n<div style=\"font-size:13px;line-height:1.6;opacity:.72;max-width:34ch\">Ordering, lot verification and certificates for licensed retail partners. Role and organisation come from your account, never from a picker.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;min-width:280px;background:#fff;padding:34px 32px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"font:600 9.5px ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--ux-muted)\">Sign in<\u002Fdiv>\n<div style=\"border:1px solid rgba(23,14,11,.3);padding:12px 13px;font-size:13.5px;color:var(--ux-muted)\">you@yourstore.com<\u002Fdiv>\n<div style=\"border:1px solid rgba(23,14,11,.3);padding:12px 13px;font-size:13.5px;color:var(--ux-muted)\">Password<\u002Fdiv>\n<div style=\"background:var(--ux-accent);color:#fff;padding:12px 14px;font:700 13px Archivo,sans-serif\">Sign in<\u002Fdiv>\n<div style=\"font-size:12px;color:var(--ux-muted);line-height:1.55\">Forgot password · Multi-factor authentication is not in phase one, recorded as an assumption rather than a decision.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px\">\n<sc-for list=\"{{ sessionStates }}\" as=\"x\" hint-placeholder-count=\"6\">\n<div style=\"border:1px solid rgba(23,14,11,.2);background:#fff;padding:22px 24px;display:flex;flex-direction:column;gap:10px\">\n<span style=\"{{ x.chipStyle }}\" style-hover=\"opacity:1\">{{ x.kind }}<\u002Fspan>\n<div style=\"font:700 17px/1.25 Archivo,sans-serif\">{{ x.title }}<\u002Fdiv>\n<div style=\"font-size:13.5px;line-height:1.6;color:var(--ux-muted-strong);flex:1\">{{ x.body }}<\u002Fdiv>\n<div style=\"border:1px solid rgba(23,14,11,.3);padding:9px 12px;font:700 12px Archivo,sans-serif;align-self:flex-start\">{{ x.action }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px\">\n<span style=\"{{ confirmChipStyle }}\">{{ confirmState }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ onPrint }}\" style=\"background:transparent;border:1px solid rgba(23,14,11,.3);padding:8px 12px;font:700 12px Archivo,sans-serif;cursor:pointer\" style-hover=\"background:var(--ux-surface)\">Print or save as PDF<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ goOrdersBtn }}\" style=\"background:transparent;border:1px solid rgba(23,14,11,.3);padding:8px 12px;font:700 12px Archivo,sans-serif;cursor:pointer\" style-hover=\"background:var(--ux-surface)\">All orders<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"border:1px solid rgba(23,14,11,.25);background:#fff;padding:36px 38px;max-width:820px\">\n<div style=\"display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid rgba(23,14,11,.4);padding-bottom:18px;margin-bottom:22px\">\n<img src=\"5c13e7cb-1632-4aa8-b750-2d668be33dd0\" alt=\"urbanXtracts\" style=\"height:38px;width:auto;display:block;align-self:flex-start;object-fit:contain\">\n<div style=\"flex:1\">\n<div style=\"font:800 20px/1.1 Archivo,sans-serif;letter-spacing:-.015em\">urbanXtracts<\u002Fdiv>\n<div style=\"font:600 9px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ux-muted);margin-top:3px\">Order confirmation<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"text-align:left\">\n<div style=\"font:800 18px Archivo,sans-serif\">{{ confirmId }}<\u002Fdiv>\n<div style=\"font-size:11.5px;color:var(--ux-muted);margin-top:3px\">{{ confirmMeta }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\
