name: Verify UX OS candidate

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build portal
        run: npm run build

      - name: Verify generated output is committed
        run: git diff --exit-code -- dist

      - name: Run release and service tests
        run: npm run verify

      - name: Verify migration baseline
        run: npm run verify:migration-baseline

      - name: Run Store concurrency tests
        run: npm run verify:store-concurrency

      - name: Check patch whitespace
        run: git diff --check
