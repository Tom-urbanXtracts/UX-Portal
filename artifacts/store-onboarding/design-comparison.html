<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store onboarding design comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: #e7e3de; color: #170e0b; font: 14px/1.4 Arial, sans-serif; }
    h1 { margin: 0 0 14px; font-size: 20px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    figure { margin: 0; min-width: 0; background: #fff; border: 1px solid #aaa19a; }
    figcaption { padding: 10px 12px; border-bottom: 1px solid #d2ccc6; font-weight: 700; }
    img { display: block; width: 100%; height: 760px; object-fit: cover; object-position: top left; }
  </style>
</head>
<body>
  <h1>Store onboarding — source and implementation</h1>
  <main>
    <figure>
      <figcaption>Source · Existing Brand onboarding workspace</figcaption>
      <img src="./source-brand-company.png" alt="Existing Brand Company and Onboarding workspace">
    </figure>
    <figure>
      <figcaption>Implementation · Store Workspace Portal</figcaption>
      <img src="./implementation-six-section.png" alt="Store Workspace six-section onboarding implementation">
    </figure>
  </main>
</body>
</html>
